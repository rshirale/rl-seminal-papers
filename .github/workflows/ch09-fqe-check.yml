# Checks whether listing 9.4's twin minimum makes FQE underestimate.
#
# Run 37353803018's CQL alpha 5.0 agent earns a discounted return of about
# 1.27 from the evaluation start states, but FQE (listing 9.4) estimates
# 0.32. Two explanations fit: the minimum over twin critics, which builds
# in pessimism, or too few FQE steps for value to propagate (gamma 0.99,
# tau 0.005). Four jobs on the same checkpoint, seeds, and start states
# separate them: {twin minimum, single critic} x {100,000, 300,000} steps.
# The twin-minimum, 100k job should reproduce 0.32.
#
# Fires only when this file changes, and ch09-runs.yml ignores changes to
# it, so a push that touches only this file runs these four jobs alone.
#
# Run 1: 2026-10-10.

name: Chapter 9 FQE check

on:
  push:
    branches: [ch09-cql-runs]
    paths: [.github/workflows/ch09-fqe-check.yml]

concurrency:
  group: ch09-fqe-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        variant: [twin_min, single]
        steps: [100000, 300000]
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (CPU PyTorch, Minari, Gymnasium Robotics)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "minari[hdf5,hf]" gymnasium-robotics numpy
          nproc

      - name: Download the alpha 5.0 checkpoint from run 37353803018
        uses: actions/download-artifact@v4
        with:
          name: cql_a5_s0
          run-id: 37353803018
          github-token: ${{ github.token }}
          path: ckpt

      - name: FQE (${{ matrix.variant }}, ${{ matrix.steps }} steps)
        run: |
          mkdir -p out
          python -W ignore - <<'EOF'
          import copy, json, os
          import numpy as np
          import torch
          import torch.nn.functional as F
          from src.part_3_applications.ch09_cql import cql as L
          from src.part_3_applications.ch09_cql import train_cql_vs_sac as T
          from src.part_3_applications.ch09_cql.eval_fqe_vs_true import (
              true_returns)

          VARIANT = "${{ matrix.variant }}"
          STEPS = ${{ matrix.steps }}
          HORIZON, STARTS = 800, 50   # eval_fqe_vs_true.py defaults

          def fqe_single(policy, buffer, fqe_critic, steps, gamma=0.99):
              """Listing 9.4 with q1 alone in the target, loss, and estimate."""
              target = copy.deepcopy(fqe_critic)
              opt = torch.optim.Adam(fqe_critic.parameters(), lr=3e-4)
              policy.eval()
              for _ in range(steps):
                  s, a, r, s2, d = buffer.sample(256)
                  with torch.no_grad():
                      a2, _ = policy(s2, deterministic=True)
                      q1_t, _ = target(s2, a2)
                      y = r + gamma * (1 - d) * q1_t
                  q1, _ = fqe_critic(s, a)
                  loss = F.mse_loss(q1, y)
                  opt.zero_grad()
                  loss.backward()
                  opt.step()
                  L.soft_update(target, fqe_critic)

          torch.set_num_threads(os.cpu_count())
          torch.manual_seed(0)
          buffer = L.load_minari(T.DATASET_ID)
          dataset = L.minari.load_dataset(T.DATASET_ID)
          env = dataset.recover_environment(max_episode_steps=HORIZON)
          seeds = np.arange(5000, 5000 + STARTS)

          ck = torch.load("ckpt/cql_a5_s0/checkpoint.pt")
          actor = T.Actor(6, 2)
          actor.load_state_dict(ck["actor"])
          actor.eval()
          s0, g_true = true_returns(env, actor, seeds, HORIZON)

          fqe = T.Critic(6, 2)
          if VARIANT == "twin_min":
              L.fitted_q_evaluation(actor, buffer, fqe, steps=STEPS)
          else:
              fqe_single(actor, buffer, fqe, STEPS)
          with torch.no_grad():
              st = torch.as_tensor(s0)
              a0, _ = actor(st, deterministic=True)
              q1, q2 = fqe(st, a0)
              est = torch.min(q1, q2) if VARIANT == "twin_min" else q1
              est = est.squeeze(-1).numpy()

          res = {"variant": VARIANT, "fqe_steps": STEPS,
                 "checkpoint_step": int(ck["step"]),
                 "true_mean": float(g_true.mean()),
                 "fqe_mean": float(est.mean()),
                 "mean_abs_error": float(np.abs(est - g_true).mean()),
                 "per_state_corr": float(np.corrcoef(est, g_true)[0, 1])}
          print(json.dumps(res))
          with open(f"out/fqe_{VARIANT}_{STEPS}.json", "w") as f:
              json.dump(res, f, indent=2)
          EOF

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fqe_${{ matrix.variant }}_${{ matrix.steps }}
          path: out/
          if-no-files-found: warn
