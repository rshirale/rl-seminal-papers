# Fails when the latest run of any workflow in the past week carries a
# warning or notice from GitHub itself, the way GitHub announces what will
# break this repo's workflows. Only the latest run counts, so a warning that a
# later commit fixed stops being reported as soon as the workflow runs again.
#
# The changelog feed holds only its last ten posts, mostly unrelated to
# Actions. The annotations are what applies here: the Node 20 deprecation
# arrived as a warning on 29 runs, and the move of ubuntu-latest to Ubuntu 26
# as a notice on the Tests runs, two days before it took effect. Notices
# count as well as warnings for that reason.
#
# GitHub's own Pages build (event "dynamic") is left out: it runs GitHub's
# workflow, not one in this repository, so nothing here can fix its warnings.
#
# Only warnings and notices are listed. Failures (a test that broke, a run
# cancelled by a newer push) already show as a red run.

name: Annotations

on:
  schedule:
    - cron: "0 8 * * 1"  # Mondays, 08:00 UTC
  workflow_dispatch:

permissions:
  actions: read
  checks: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Collect the past week's warnings and notices
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          since=$(date -u -d '8 days ago' +%Y-%m-%d)
          gh api --paginate "repos/$REPO/actions/runs?created=>=$since&per_page=100" \
            --jq '.workflow_runs[] | select(.status == "completed" and .event != "dynamic")
                  | "\(.workflow_id) \(.created_at) \(.id)"' \
            | sort -k1,1 -k2,2r | awk '!seen[$1]++ { print $3 }' > runs.txt
          for run in $(cat runs.txt); do
            gh api --paginate "repos/$REPO/actions/runs/$run/jobs?per_page=100" \
              --jq '.jobs[] | "\(.check_run_url) \(.html_url)"'
          done | while read -r check job; do
            gh api "$check/annotations" \
              --jq '.[] | select(.annotation_level == "warning" or .annotation_level == "notice")
                        | "\(.annotation_level)\t\(.message)"' \
              | awk -v job="$job" '{ print $0 "\t" job }'
          done > found.tsv

          {
            echo "## Annotations since $since"
            echo
            echo "Latest completed run of $(wc -l < runs.txt | tr -d ' ') workflows checked."
            echo
            if [ -s found.tsv ]; then
              echo "| Level | Jobs | Message | Latest job |"
              echo "| --- | --- | --- | --- |"
              sort -t$'\t' -k1,2 found.tsv | awk -F'\t' '
                { key = $1 "\t" $2; n[key]++; last[key] = $3 }
                END { for (k in n) { split(k, f, "\t"); gsub(/\|/, "\\|", f[2])
                      printf "| %s | %d | %s | [job](%s) |\n", f[1], n[k], f[2], last[k] } }'
            else
              echo "None."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -s found.tsv ]; then
            cut -f1,2 found.tsv | sort | uniq -c
            echo "::error::GitHub left warnings or notices on this week's runs; see the job summary."
            exit 1
          fi
